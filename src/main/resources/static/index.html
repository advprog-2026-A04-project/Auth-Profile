<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JSON - Auth Profile</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 0 20px; }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; margin-top: 8px; }
        button:hover { background: #0056b3; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        .message { margin-top: 12px; padding: 10px; border-radius: 4px; text-align: center; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .secondary { background: white; color: #007bff; border: 1px solid #007bff; margin-top: 8px; }
        .secondary:hover { background: #f0f0f0; }
        #logged-in { display: none; text-align: center; }
        #logged-out { display: block; }
        #register-form { display: none; margin-top: 16px; }
    </style>
</head>
<body>

<!-- Tampilan kalau belum login -->
<div id="logged-out">
    <div class="box">
        <h2 style="text-align:center; margin-top:0">JSON Auth</h2>

        <div id="login-form">
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Login</button>
            <button class="secondary" onclick="showRegister()">Belum punya akun? Register</button>
        </div>

        <div id="register-form">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-password" placeholder="Password">
            <input type="text" id="reg-username" placeholder="Username (opsional)">
            <button onclick="register()">Register</button>
            <button class="secondary" onclick="showLogin()">Udah punya akun? Login</button>
        </div>

        <div id="message"></div>
    </div>
</div>

<!-- Tampilan kalau sudah login -->
<div id="logged-in">
    <div class="box">
        <h2 style="margin-top:0">Selamat datang!</h2>
        <p>Login sebagai: <strong id="user-email"></strong></p>
        <button onclick="logout()" style="background:#dc3545;">Logout</button>
    </div>
</div>

<script>
    // Cek session waktu halaman dibuka
    window.onload = function() {
        const email = sessionStorage.getItem('userEmail');
        if (email) showLoggedIn(email);
    }

    function showRegister() {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'block';
        clearMessage();
    }

    function showLogin() {
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('login-form').style.display = 'block';
        clearMessage();
    }

    function showLoggedIn(email) {
        document.getElementById('logged-out').style.display = 'none';
        document.getElementById('logged-in').style.display = 'block';
        document.getElementById('user-email').innerText = email;
    }

    function clearMessage() {
        document.getElementById('message').innerText = '';
        document.getElementById('message').className = 'message';
    }

    function showMessage(text, isError) {
        const el = document.getElementById('message');
        el.innerText = text;
        el.className = 'message ' + (isError ? 'error' : 'success');
    }

    async function register() {
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const username = document.getElementById('reg-username').value;

        const res = await fetch('/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email, password, username })
        });
        const text = await res.text();
        if (res.ok) {
            showMessage('Register berhasil! Silakan login.', false);
            showLogin();
        } else {
            showMessage(text, true);
        }
    }

    async function login() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        const res = await fetch('/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email, password })
        });
        const text = await res.text();
        if (res.ok) {
            sessionStorage.setItem('userEmail', email);
            showLoggedIn(email);
        } else {
            showMessage(text, true);
        }
    }

    function logout() {
        sessionStorage.removeItem('userEmail');
        document.getElementById('logged-in').style.display = 'none';
        document.getElementById('logged-out').style.display = 'block';
        showLogin();
    }
</script>
</body>
</html>
